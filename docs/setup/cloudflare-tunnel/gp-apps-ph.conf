# Cloudflare Tunnel origins — HTTP only (TLS at Cloudflare edge).
# Installed by install-nginx-ph.sh → sites-enabled/gp-apps-ph.conf
# Do not redirect these to .com.

upstream gp_hris_ph { server 127.0.0.1:3000; }
upstream gp_csm_ph { server 127.0.0.1:3003; }
upstream gp_client_ph { server 127.0.0.1:3001; }
upstream sb_hris_ph { server 127.0.0.1:8000; }
upstream sb_csm_ph { server 127.0.0.1:8100; }
upstream sb_client_ph { server 127.0.0.1:8200; }

server {
    listen 80;
    listen [::]:80;
    server_name hris.greenpasture.ph;

    location ^~ /auth/ {
        proxy_pass http://sb_hris_ph;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include snippets/gp-supabase-buffers.conf;
        proxy_buffering off;
    }
    location ^~ /rest/ {
        proxy_pass http://sb_hris_ph;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        include snippets/gp-supabase-buffers.conf;
        proxy_buffering off;
    }
    location ^~ /realtime/ {
        proxy_pass http://sb_hris_ph;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        include snippets/gp-supabase-buffers.conf;
        proxy_buffering off;
    }
    location ^~ /storage/ {
        proxy_pass http://sb_hris_ph;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        include snippets/gp-supabase-buffers.conf;
        proxy_buffering off;
    }
    location ^~ /functions/ {
        proxy_pass http://sb_hris_ph;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        include snippets/gp-supabase-buffers.conf;
        proxy_buffering off;
    }
    location ^~ /graphql/ {
        proxy_pass http://sb_hris_ph;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        include snippets/gp-supabase-buffers.conf;
        proxy_buffering off;
    }
    location / {
        include snippets/gp-proxy-params.conf;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://gp_hris_ph;
    }
}

